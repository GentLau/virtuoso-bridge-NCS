name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Run full test suite
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

  windows-ssh:
    name: Windows / SSH transports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Run SSH transport tests
        run: uv run --python 3.11 --extra dev pytest test/unit/test_ssh.py test/unit/test_paramiko.py test/unit/test_transfer.py
