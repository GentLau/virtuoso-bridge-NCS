<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Virtuoso Bridge 业务操作体验台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f8;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --ink: #182033;
      --muted: #667085;
      --soft: #98a2b3;
      --line: #dfe4ec;
      --line-strong: #c9d1dd;
      --primary: #5a4ee8;
      --primary-dark: #4437c8;
      --primary-soft: #eeecff;
      --success: #13795b;
      --success-soft: #e9f8f1;
      --danger: #c2374e;
      --danger-soft: #fff0f3;
      --warning: #a95b07;
      --warning-soft: #fff5e7;
      --info: #2864a8;
      --info-soft: #edf5ff;
      --terminal: #161a2c;
      --shadow: 0 18px 50px rgba(23, 31, 55, .09);
      --shadow-soft: 0 8px 22px rgba(23, 31, 55, .06);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 0%, rgba(90, 78, 232, .10), transparent 26rem),
        radial-gradient(circle at 96% 8%, rgba(40, 100, 168, .07), transparent 24rem),
        var(--bg);
      font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
        "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1560px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 42px; }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: var(--radius);
      background: rgba(255,255,255,.86);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 13px; color: #fff;
      background: linear-gradient(145deg, #7265f3, #4437c8);
      box-shadow: 0 10px 22px rgba(90,78,232,.27);
      font-weight: 850; letter-spacing: -.05em;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .connection {
      display: grid;
      grid-template-columns: minmax(210px, 290px) minmax(160px, 220px) auto;
      align-items: end;
      gap: 10px;
    }
    .connection .field { margin: 0; }
    .field { min-width: 0; }
    .field > label {
      display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
      color: #45546b; font-size: 10px; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 10px;
      outline: 0; color: var(--ink); background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .field input, .field select { height: 38px; padding: 0 11px; }
    .field textarea {
      min-height: 108px; padding: 10px 11px; resize: vertical;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px; line-height: 1.55;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(90,78,232,.12);
    }
    .field input:disabled, .field select:disabled, .field textarea:disabled {
      color: var(--soft); background: #f3f5f8;
    }
    .field-help { margin: 5px 1px 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .token-wrap { display: flex; gap: 6px; }
    .token-wrap input { min-width: 0; }
    .reveal {
      width: 38px; flex: 0 0 auto; border: 1px solid var(--line-strong);
      border-radius: 10px; cursor: pointer; color: #526077; background: #fff;
    }
    .reveal:hover { border-color: var(--primary); color: var(--primary-dark); }

    .btn {
      min-height: 38px; display: inline-flex; align-items: center; justify-content: center;
      gap: 7px; padding: 8px 13px; border: 1px solid transparent; border-radius: 10px;
      cursor: pointer; font-size: 11px; font-weight: 800; line-height: 1.2;
      transition: transform .14s ease, background .14s ease, border-color .14s ease,
        box-shadow .14s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:focus-visible { outline: 3px solid rgba(90,78,232,.2); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    .btn-primary {
      color: #fff; background: var(--primary);
      box-shadow: 0 8px 18px rgba(90,78,232,.23);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { border-color: var(--line-strong); color: #344054; background: #fff; }
    .btn-secondary:hover:not(:disabled) { border-color: #aaa1ed; background: #faf9ff; }
    .btn-ghost { border-color: transparent; color: #586780; background: transparent; }
    .btn-ghost:hover:not(:disabled) { color: var(--ink); background: var(--panel-soft); }
    .btn-small { min-height: 30px; padding: 5px 9px; font-size: 10px; }

    .layout {
      display: grid;
      grid-template-columns: 255px minmax(410px, .95fr) minmax(430px, 1.05fr);
      gap: 16px;
      align-items: start;
    }
    .panel {
      border: 1px solid rgba(255,255,255,.95);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .panel-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 18px 19px 14px; border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 3px; color: var(--primary); font-size: 9px; font-weight: 850;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .panel-header h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .panel-header p:not(.eyebrow) { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .count {
      padding: 5px 8px; border-radius: 99px; color: var(--primary-dark);
      background: var(--primary-soft); font-size: 9px; font-weight: 850;
      white-space: nowrap;
    }
    .catalog { position: sticky; top: 16px; overflow: hidden; }
    .catalog-search { padding: 13px 14px 8px; }
    .catalog-search input { height: 35px; }
    .catalog-body { max-height: calc(100vh - 165px); overflow: auto; padding: 0 9px 12px; }
    .catalog-group { margin-top: 9px; }
    .catalog-group-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 8px 4px; color: var(--soft); font-size: 9px; font-weight: 850;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .op-list { display: grid; gap: 3px; }
    .op-button {
      width: 100%; display: grid; grid-template-columns: 25px minmax(0, 1fr);
      align-items: center; gap: 8px; padding: 8px;
      border: 1px solid transparent; border-radius: 9px;
      cursor: pointer; text-align: left; color: #45546b; background: transparent;
    }
    .op-button:hover { border-color: #dedafb; background: #f8f7ff; }
    .op-button.active {
      border-color: #bdb5fb; color: var(--primary-dark); background: var(--primary-soft);
    }
    .op-icon {
      width: 25px; height: 25px; display: grid; place-items: center;
      border-radius: 8px; color: var(--primary); background: #f0eeff;
      font-size: 10px; font-weight: 850;
    }
    .op-button.active .op-icon { color: #fff; background: var(--primary); }
    .op-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .op-name strong { display: block; font-size: 10px; }
    .op-name span { display: block; margin-top: 1px; color: var(--soft); font-size: 8px; }
    .catalog-empty { padding: 18px 10px; color: var(--soft); text-align: center; font-size: 10px; }
    .history {
      margin: 12px 9px 0; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .history-title { padding: 0 8px 5px; color: var(--soft); font-size: 9px; font-weight: 850; text-transform: uppercase; }
    .history-list { display: grid; gap: 4px; }
    .history-item {
      width: 100%; display: grid; grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center; gap: 7px; padding: 7px 8px;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      color: #4f5f76; background: transparent; text-align: left;
    }
    .history-item:hover { border-color: var(--line); background: var(--panel-soft); }
    .history-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--soft); }
    .history-dot.ok { background: var(--success); }
    .history-dot.bad { background: var(--danger); }
    .history-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
    .history-item small { color: var(--soft); font-size: 8px; white-space: nowrap; }

    .request-panel, .result-panel { overflow: hidden; }
    .request-body, .result-body { padding: 18px 19px 20px; }
    .operation-hero {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px; align-items: start; margin-bottom: 15px;
      padding: 13px 14px; border: 1px solid #e5e2ff; border-radius: 12px;
      background: linear-gradient(145deg, #faf9ff, #f3f1ff);
    }
    .operation-hero h3 { margin: 0; color: #302a75; font-size: 14px; }
    .operation-hero p { margin: 5px 0 0; color: #68708d; font-size: 10px; }
    .risk-chip {
      height: fit-content; padding: 5px 8px; border-radius: 99px;
      color: #76520d; background: #fff0c9; font-size: 9px; font-weight: 850;
      white-space: nowrap;
    }
    .risk-chip.read { color: #28604e; background: #dff5ea; }
    .risk-chip.write { color: #9a4e0d; background: #ffebd5; }
    .request-form { display: grid; gap: 14px; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .checkbox-row {
      display: flex; align-items: flex-start; gap: 9px; padding: 10px 11px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft);
    }
    .checkbox-row input { width: 16px; height: 16px; flex: 0 0 auto; margin: 2px 0 0; accent-color: var(--primary); }
    .checkbox-row label { cursor: pointer; color: #526077; font-size: 10px; }
    .checkbox-row strong { color: var(--ink); }
    .form-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 3px; padding-top: 15px; border-top: 1px solid var(--line);
    }
    .form-actions-note { max-width: 330px; margin: 0; color: var(--muted); font-size: 9px; }
    .request-preview {
      margin-top: 16px; border: 1px solid var(--line); border-radius: 11px;
      overflow: hidden; background: #fbfcfe;
    }
    .request-preview summary {
      cursor: pointer; padding: 10px 12px; color: #57657c; font-size: 10px; font-weight: 800;
    }
    .request-preview pre, .raw-json {
      max-height: 320px; overflow: auto; margin: 0; padding: 12px;
      border-top: 1px solid var(--line); color: #d7dbff; background: var(--terminal);
      white-space: pre-wrap; overflow-wrap: anywhere;
      font: 10px/1.55 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    .warning-box {
      display: flex; align-items: flex-start; gap: 9px; margin-bottom: 13px;
      padding: 10px 11px; border: 1px solid #f0d2a4; border-radius: 10px;
      color: #83521a; background: var(--warning-soft); font-size: 10px;
    }
    .warning-box b {
      width: 18px; height: 18px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 6px; color: #fff; background: #d98b2b; font-size: 10px;
    }

    .connection-strip {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px; padding: 10px 11px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft);
      color: var(--muted); font-size: 10px;
    }
    .status-dot {
      width: 8px; height: 8px; display: inline-block; margin-right: 6px;
      border-radius: 50%; background: var(--soft); box-shadow: 0 0 0 4px #eef1f5;
    }
    .status-dot.ok { background: var(--success); box-shadow: 0 0 0 4px #e5f6ee; }
    .status-dot.bad { background: var(--danger); box-shadow: 0 0 0 4px #fdebed; }
    .status-dot.wait { background: var(--warning); box-shadow: 0 0 0 4px #fff6e5; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .meta-chip {
      padding: 5px 8px; border: 1px solid var(--line); border-radius: 99px;
      color: #59677d; background: #fff; font-size: 9px;
    }
    .meta-chip.good { border-color: #bfe5d3; color: var(--success); background: #f1fbf6; }
    .meta-chip.bad { border-color: #f0bcc6; color: var(--danger); background: #fff5f6; }
    .result-block {
      margin-top: 10px; border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden; background: #fff;
    }
    .result-block-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line);
      color: #526077; background: var(--panel-soft); font-size: 9px; font-weight: 850;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .result-block pre {
      max-height: 280px; overflow: auto; margin: 0; padding: 11px;
      color: #303a4d; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere;
      font: 10px/1.55 "Cascadia Code", Consolas, monospace;
    }
    .empty-result {
      display: grid; place-items: center; min-height: 250px; padding: 24px;
      border: 1px dashed #d8ddea; border-radius: 12px; color: var(--soft);
      background: #fbfcfe; text-align: center; font-size: 11px;
    }
    .empty-result strong { display: block; margin-bottom: 5px; color: #65738a; font-size: 13px; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(90,78,232,.2);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 20;
      max-width: min(380px, calc(100% - 32px)); padding: 10px 13px;
      border-radius: 10px; color: #fff; background: #273044;
      box-shadow: 0 12px 30px rgba(24,32,51,.24); font-size: 10px;
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: .18s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #9f263b; }
    [hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1220px) {
      .layout { grid-template-columns: 235px minmax(390px, 1fr) minmax(390px, 1fr); }
    }
    @media (max-width: 1080px) {
      .topbar { grid-template-columns: 1fr; }
      .connection { grid-template-columns: minmax(0, 1fr) minmax(160px, 240px) auto; }
      .layout { grid-template-columns: 225px minmax(0, 1fr); }
      .result-panel { grid-column: 2; }
    }
    @media (max-width: 760px) {
      .shell { width: calc(100% - 20px); padding-top: 10px; }
      .connection, .layout, .form-row { grid-template-columns: 1fr; }
      .result-panel { grid-column: 1; }
      .catalog { position: static; }
      .catalog-body { max-height: 300px; }
      .op-name span { display: none; }
      .operation-hero { grid-template-columns: 1fr; }
      .form-actions { align-items: stretch; flex-direction: column; }
      .form-actions .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">VB</div>
        <div>
          <h1>业务操作体验台</h1>
          <p>人工输入业务参数，观察真实业务面返回</p>
        </div>
      </div>
      <div class="connection">
        <div class="field">
          <label for="baseUrl">业务面地址</label>
          <input id="baseUrl" placeholder="留空使用当前同源代理（推荐）">
        </div>
        <div class="field">
          <label for="token">个人 Token</label>
          <div class="token-wrap">
            <input id="token" type="password" placeholder="输入 token" autocomplete="off">
            <button id="revealToken" class="reveal" type="button" aria-label="显示或隐藏 token">◉</button>
          </div>
        </div>
        <button id="checkBtn" class="btn btn-secondary" type="button">检查连接</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel catalog" aria-label="业务操作目录">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Operation Catalog</p>
            <h2>业务操作</h2>
            <p>首版提供六个直通操作，其他操作走原始请求</p>
          </div>
          <span id="operationCount" class="count">--</span>
        </div>
        <div class="catalog-search">
          <div class="field">
            <label for="search">搜索操作</label>
            <input id="search" placeholder="例如 skill / command / layout">
          </div>
        </div>
        <div id="catalogBody" class="catalog-body"></div>
      </aside>

      <section class="panel request-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Request Builder</p>
            <h2 id="requestTitle">选择操作</h2>
            <p id="requestSubtitle">从左侧选择业务操作填写参数</p>
          </div>
          <span id="requestRisk" class="risk-chip">待选择</span>
        </div>
        <div class="request-body">
          <div class="connection-strip">
            <span><i id="connectionDot" class="status-dot"></i><span id="connectionText">尚未检查连接</span></span>
            <span id="targetText">--</span>
          </div>
          <div id="operationHero" class="operation-hero">
            <div>
              <h3 id="heroTitle">请选择操作</h3>
              <p id="heroDescription">选择后这里会显示参数说明和风险提示。</p>
            </div>
            <span id="heroId" class="count">--</span>
          </div>
          <div id="warningBox" class="warning-box" hidden>
            <b aria-hidden="true">!</b>
            <span id="warningText"></span>
          </div>
          <form id="operationForm" class="request-form" autocomplete="off"></form>
          <div class="form-actions">
            <p id="actionNote" class="form-actions-note">请求只会在点击“执行操作”后发送。</p>
            <button id="sendBtn" class="btn btn-primary" type="submit" form="operationForm" disabled>
              <span id="sendLabel">执行操作</span>
            </button>
          </div>
          <details class="request-preview">
            <summary>查看将要发送的请求（token 已隐藏）</summary>
            <pre id="requestPreview">{}</pre>
          </details>
        </div>
      </section>

      <section class="panel result-panel" aria-live="polite" aria-atomic="false">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Business Response</p>
            <h2>业务返回</h2>
            <p>原始业务 JSON 原样展示，不做字段解析</p>
          </div>
          <span id="lastDuration" class="count">--</span>
        </div>
        <div id="resultBody" class="result-body">
          <div class="empty-result">
            <div>
              <strong>还没有执行结果</strong>
              选择左侧操作、填写参数后点击执行。
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const CURATED = [
      {
        id: 'basic.skill.execute',
        title: '执行 SKILL',
        short: 'SKILL',
        description: '在 Virtuoso CIW daemon 中执行一段 SKILL 表达式，返回 output、CDS.log 增量与状态。',
        risk: 'write',
        riskText: '可能修改 Virtuoso 状态',
        fields: [
          {name: 'skill_code', label: 'SKILL 表达式', type: 'textarea', required: true, value: '1+1',
            help: '空表达式不会发送。'}
        ],
        note: '适合先试 1+1、getWorkingDir() 等只读表达式。'
      },
      {
        id: 'basic.command.run',
        title: '执行命令',
        short: 'CMD',
        description: '在 command role 执行一次性 shell 命令，支持 parallel 标记。',
        risk: 'write',
        riskText: '会执行真实命令',
        fields: [
          {name: 'cmd', label: 'Shell 命令', type: 'input', required: true, value: 'hostname',
            placeholder: '例如 hostname、pwd、ls -la'},
          {name: 'parallel', label: 'parallel 模式', type: 'checkbox', value: false,
            help: 'true 表示一次性通道语义；不依赖持久 shell。'}
        ],
        note: '先用 hostname 或 pwd 这类只读命令验证 token 和路由。'
      },
      {
        id: 'basic.gui.run',
        title: '执行 GUI 命令',
        short: 'GUI',
        description: '在 gui role 执行一次性命令，适合 xdotool、窗口辅助和只读检查。',
        risk: 'write',
        riskText: '会执行真实 GUI 命令',
        fields: [
          {name: 'cmd', label: 'GUI 命令', type: 'input', required: true, value: 'echo gui-ok',
            placeholder: '例如 echo gui-ok'}
        ],
        note: '先用 echo gui-ok 验证 gui role，再尝试窗口相关命令。'
      },
      {
        id: 'basic.spectre.run',
        title: '执行 Spectre 命令',
        short: 'SPEC',
        description: '在 spectre role 执行一次性命令，不建立持久 shell。',
        risk: 'write',
        riskText: '会执行真实 Spectre 命令',
        fields: [
          {name: 'cmd', label: 'Spectre 命令', type: 'input', required: true, value: 'which spectre',
            placeholder: '例如 which spectre 或 spectre -W'}
        ],
        note: '先用 which spectre 验证 Spectre role 与 bin 路由。'
      },
      {
        id: 'basic.file.upload',
        title: '上传文件',
        short: 'UP',
        description: '把本机路径上传到 file role 的远端路径。',
        risk: 'write',
        riskText: '会产生文件副作用',
        fields: [
          {name: 'local_path', label: '本机路径', type: 'input', required: true,
            placeholder: '例如 C:/tmp/input.txt'},
          {name: 'remote_path', label: '远端路径', type: 'input', required: true,
            placeholder: '例如 /home/user/input.txt'},
          {name: 'recursive', label: '递归传输', type: 'checkbox', value: false}
        ],
        note: '本机路径由业务服务器所在进程解析，不是浏览器上传文件内容。'
      },
      {
        id: 'basic.file.download',
        title: '下载文件',
        short: 'DOWN',
        description: '把 file role 的远端路径下载到本机路径。',
        risk: 'write',
        riskText: '会写入本机文件',
        fields: [
          {name: 'remote_path', label: '远端路径', type: 'input', required: true,
            placeholder: '例如 /home/user/result.txt'},
          {name: 'local_path', label: '本机路径', type: 'input', required: true,
            placeholder: '例如 C:/tmp/result.txt'},
          {name: 'recursive', label: '递归传输', type: 'checkbox', value: false}
        ],
        note: '如果目标路径已存在，请确认覆盖符合预期。'
      }
    ];

    const GENERIC = {
      id: '__generic__',
      title: '原始业务请求',
      short: 'JSON',
      description: '直接构造业务字段，适合调试尚未图形化的操作。',
      risk: 'write',
      riskText: '原始参数',
      fields: [
        {name: 'payload', label: '业务字段 JSON', type: 'textarea', value: '{}', required: true,
          help: 'operation 与 token 由上方字段统一注入；这里填写业务字段对象。'}
      ],
      note: '原始操作仍会走生产业务面校验、路由和副作用。'
    };

    const FALLBACK_OPERATIONS = CURATED.map((item) => item.id).concat([
      'virtuoso.skillref.search',
      'virtuoso.skillref.info',
      'virtuoso.cellview.lib.list',
      'virtuoso.cellview.cell.list',
      'virtuoso.schematic.read',
      'virtuoso.layout.read',
      'virtuoso.maestro.read_config'
    ]);

    const state = {
      operations: FALLBACK_OPERATIONS.slice(),
      selected: CURATED[0].id,
      rawOperation: '',
      history: [],
      currentResponse: null,
      controller: null,
      busy: false,
      helpLoaded: false
    };

    const $ = (id) => document.getElementById(id);
    const catalogBody = $('catalogBody');
    const form = $('operationForm');
    const toastEl = $('toast');

    function panel(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

    function showToast(message, error) {
      toastEl.textContent = message;
      toastEl.className = 'toast show' + (error ? ' error' : '');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { toastEl.className = 'toast'; }, 2400);
    }

    function curations() {
      const map = new Map(CURATED.map((item) => [item.id, item]));
      map.set(GENERIC.id, GENERIC);
      return map;
    }

    function definition(id) {
      return curations().get(id) || {
        ...GENERIC,
        id,
        title: id,
        description: '该操作当前使用原始 JSON 参数面板。',
        riskText: '未图形化'
      };
    }

    function normalizeBase(value) {
      let base = String(value || '').trim().replace(/\/+$/, '');
      if (base.endsWith('/api/operation')) base = base.slice(0, -'/api/operation'.length);
      return base;
    }

    function apiUrl(path) {
      return normalizeBase($('baseUrl').value) + path;
    }

    function setConnection(kind, text) {
      $('connectionDot').className = 'status-dot ' + kind;
      $('connectionText').textContent = text;
    }

    function getToken() {
      return $('token').value.trim();
    }

    async function fetchJSON(path, options, timeoutMs) {
      const controller = new AbortController();
      state.controller = controller;
      const timer = window.setTimeout(() => controller.abort(), timeoutMs || 600000);
      try {
        const response = await fetch(apiUrl(path), {
          ...(options || {}),
          headers: {
            'Accept': 'application/json',
            ...((options && options.headers) || {})
          },
          signal: controller.signal
        });
        const text = await response.text();
        let data = null;
        if (text) {
          try { data = JSON.parse(text); }
          catch (error) {
            const invalid = new Error('响应不是合法 JSON');
            invalid.status = response.status;
            invalid.payload = {ok: false, data: null, error: text.slice(0, 500)};
            throw invalid;
          }
        }
        return {http: response.status, payload: data};
      } finally {
        window.clearTimeout(timer);
        if (state.controller === controller) state.controller = null;
      }
    }

    async function checkConnection() {
      const button = $('checkBtn');
      button.disabled = true;
      setConnection('wait', '正在检查业务面…');
      try {
        const health = await fetchJSON('/health', {}, 10000);
        await fetchJSON('/help', {}, 10000);
        const catalog = await fetchJSON('/help/operations', {}, 10000);
        let upstream = '';
        try {
          const config = await fetchJSON('/__console__/config', {}, 5000);
          upstream = (config.payload && config.payload.data && config.payload.data.business_base) || '';
        } catch (error) {}
        const hdata = (health.payload && health.payload.data) || {};
        const groups = (catalog.payload && catalog.payload.data && catalog.payload.data.groups) || {};
        const ops = [];
        Object.keys(groups).forEach(function(key) {
          (groups[key] || []).forEach(function(item) { ops.push(item.name); });
        });
        if (Array.isArray(ops) && ops.length) {
          state.operations = ops.slice().sort();
          state.helpLoaded = true;
        }
        setConnection('ok', `业务面可达 · ${hdata.operations || state.operations.length} 个操作`);
        $('targetText').textContent = normalizeBase($('baseUrl').value) || upstream || '同源代理';
        renderCatalog();
        showToast('业务面连接正常');
      } catch (error) {
        setConnection('bad', '连接失败');
        showToast(error.name === 'AbortError' ? '检查连接超时' : error.message, true);
      } finally {
        button.disabled = false;
      }
    }

    function makeOperationButton(id) {
      const def = definition(id);
      const button = panel('button', 'op-button' + (state.selected === id ? ' active' : ''));
      button.type = 'button';
      button.dataset.operation = id;
      const icon = panel('span', 'op-icon', def.short || 'OP');
      const name = panel('span', 'op-name');
      name.append(panel('strong', '', def.title || id), panel('span', '', id));
      button.append(icon, name);
      button.addEventListener('click', () => selectOperation(id));
      return button;
    }

    function renderCatalog() {
      const query = $('search').value.trim().toLowerCase();
      clear(catalogBody);
      $('operationCount').textContent = String(state.operations.length);
      const curated = CURATED.filter((item) => !query || item.id.toLowerCase().includes(query)
        || item.title.toLowerCase().includes(query));
      const curatedIds = new Set(CURATED.map((item) => item.id));
      const others = state.operations.filter((id) => !curatedIds.has(id)
        && (!query || id.toLowerCase().includes(query)));

      const quickTitle = panel('div', 'catalog-group-title');
      quickTitle.append(panel('span', '', 'Quick Operations'),
        panel('span', '', String(curated.length)));
      const quickList = panel('div', 'op-list');
      curated.forEach((item) => quickList.appendChild(makeOperationButton(item.id)));
      const quick = panel('div', 'catalog-group');
      quick.append(quickTitle, quickList);
      catalogBody.appendChild(quick);

      if (others.length) {
        const otherTitle = panel('div', 'catalog-group-title');
        otherTitle.append(panel('span', '', 'All Operations'), panel('span', '', String(others.length)));
        const otherList = panel('div', 'op-list');
        others.forEach((id) => otherList.appendChild(makeOperationButton(id)));
        const other = panel('div', 'catalog-group');
        other.append(otherTitle, otherList);
        catalogBody.appendChild(other);
      }

      if (!curated.length && !others.length) {
        catalogBody.appendChild(panel('div', 'catalog-empty', '没有匹配的操作名'));
      }
      renderHistory();
    }

    function currentRequestFor(id) {
      return state.history.find((item) => item.operation === id && item.request)?.request || null;
    }

    function addField(wrapper, field) {
      const fieldBox = panel('div', 'field');
      const label = panel('label', '', field.label);
      label.htmlFor = 'f_' + field.name;
      fieldBox.appendChild(label);
      const value = field.value;
      let control;
      if (field.type === 'textarea') {
        control = panel('textarea');
        control.value = value || '';
      } else if (field.type === 'checkbox') {
        control = panel('input');
        control.type = 'checkbox';
        control.checked = Boolean(value);
      } else if (field.type === 'number') {
        control = panel('input');
        control.type = 'number';
        control.value = value === undefined || value === null ? '' : value;
        control.min = field.min || '1';
        control.step = field.step || '1';
      } else {
        control = panel('input');
        control.type = field.inputType || 'text';
        control.value = value === undefined || value === null ? '' : value;
      }
      control.id = 'f_' + field.name;
      control.dataset.field = field.name;
      control.dataset.kind = field.type || 'input';
      if (field.required && field.type !== 'checkbox') control.required = true;
      if (field.placeholder) control.placeholder = field.placeholder;
      fieldBox.appendChild(control);
      if (field.help) fieldBox.appendChild(panel('p', 'field-help', field.help));
      wrapper.appendChild(fieldBox);
      control.addEventListener('input', updatePreview);
      control.addEventListener('change', updatePreview);
    }

    function renderForm() {
      const def = definition(state.selected);
      clear(form);
      if (def.id === '__generic__' || !curations().has(def.id)) {
        addField(form, def.fields[0]);
      } else {
        def.fields.forEach((field) => addField(form, field));
        addField(form, {
          name: 'timeout',
          label: '请求超时（秒）',
          type: 'number',
          value: 60,
          min: 1,
          step: 1,
          help: '仅控制业务调用超时；页面本身最多等待 10 分钟。'
        });
      }
      renderOperationHeader(def);
      $('sendBtn').disabled = state.busy;
      updatePreview();
    }

    function renderOperationHeader(def) {
      const rawId = def.id === GENERIC.id ? state.rawOperation : '';
      $('requestTitle').textContent = rawId ? '原始业务请求' : def.title;
      $('requestSubtitle').textContent = rawId || def.id;
      $('heroTitle').textContent = rawId ? '原始业务请求' : def.title;
      $('heroDescription').textContent = def.description;
      $('heroId').textContent = rawId || def.id;
      $('requestRisk').textContent = def.riskText;
      $('requestRisk').className = 'risk-chip ' + (def.risk === 'read' ? 'read' : 'write');
      $('warningBox').hidden = def.risk !== 'write';
      $('warningText').textContent = def.note || '该操作会访问真实业务环境，请确认参数和副作用。';
      $('actionNote').textContent = def.note || '请求只会在点击“执行操作”后发送。';
    }

    function selectOperation(id) {
      state.selected = id;
      const def = definition(id);
      if (!curations().has(id)) {
        state.rawOperation = id;
        state.selected = '__generic__';
        renderForm();
        const payload = form.querySelector('[data-field="payload"]');
        if (payload) payload.value = JSON.stringify({}, null, 2);
        $('heroId').textContent = id;
        $('requestSubtitle').textContent = id;
        $('heroTitle').textContent = '原始业务请求';
        $('heroDescription').textContent = '该操作尚未图形化，使用 JSON 业务字段发送。';
        $('requestRisk').textContent = '未图形化';
        $('operationHero').dataset.operation = id;
      } else {
        state.rawOperation = '';
      }
      renderCatalog();
      renderForm();
    }

    function formValues() {
      const values = {};
      form.querySelectorAll('[data-field]').forEach((control) => {
        const name = control.dataset.field;
        if (control.type === 'checkbox') values[name] = control.checked;
        else if (control.dataset.kind === 'number') {
          if (control.value.trim()) values[name] = Number(control.value);
        } else values[name] = control.value;
      });
      return values;
    }

    function buildPayload() {
      let operation = state.selected;
      if (operation === '__generic__') operation = state.rawOperation || $('operationHero').dataset.operation || '';
      const values = formValues();
      let payload = {};
      if (operation === '__generic__' || !curations().has(operation)) {
        try { payload = JSON.parse(values.payload || '{}'); }
        catch (error) { throw new Error('业务字段 JSON 解析失败：' + error.message); }
        if (!payload || Array.isArray(payload) || typeof payload !== 'object') {
          throw new Error('业务字段必须是 JSON 对象');
        }
      } else {
        payload = {...values};
      }
      return {operation, ...payload, token: getToken()};
    }

    function maskPayload(payload) {
      const copy = {...payload};
      if (copy.token) copy.token = '••••••';
      return copy;
    }

    function updatePreview() {
      try {
        const payload = buildPayload();
        $('requestPreview').textContent = JSON.stringify(maskPayload(payload), null, 2);
      } catch (error) {
        $('requestPreview').textContent = '// ' + error.message;
      }
    }

    function statusOf(payload) {
      if (!payload || typeof payload !== 'object') return {ok: false, label: '无效响应'};
      return {ok: Boolean(payload.ok), label: payload.ok ? '业务成功' : '业务失败'};
    }

    function resultBlock(title, content, copy) {
      const block = panel('div', 'result-block');
      const head = panel('div', 'result-block-head');
      head.appendChild(panel('span', '', title));
      if (copy) {
        const button = panel('button', 'btn btn-secondary btn-small', '复制');
        button.type = 'button';
        button.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(content); showToast('已复制'); }
          catch (error) { showToast('复制失败', true); }
        });
        head.appendChild(button);
      }
      block.append(head, panel('pre', '', content));
      return block;
    }

    function renderResponse(record) {
      const payload = record.payload;
      const status = statusOf(payload);
      state.currentResponse = payload;
      clear($('resultBody'));
      $('lastDuration').textContent = record.duration + ' ms';

      const chips = panel('div', 'meta-row');
      const httpChip = panel('span', 'meta-chip ' + (record.http >= 200 && record.http < 300 ? 'good' : 'bad'),
        'HTTP ' + record.http);
      const businessChip = panel('span', 'meta-chip ' + (status.ok ? 'good' : 'bad'), status.label);
      const operationChip = panel('span', 'meta-chip', record.operation);
      chips.append(httpChip, businessChip, operationChip);
      $('resultBody').appendChild(chips);
      $('resultBody').appendChild(resultBlock('原始业务数据', JSON.stringify(payload, null, 2), true));
    }

    function renderHistory() {
      const body = catalogBody.querySelector('.history');
      if (body) body.remove();
      if (!state.history.length) return;
      const wrap = panel('div', 'history');
      wrap.appendChild(panel('div', 'history-title', '本次会话历史'));
      const list = panel('div', 'history-list');
      state.history.slice().reverse().forEach((record) => {
        const item = panel('button', 'history-item');
        item.type = 'button';
        const status = statusOf(record.payload);
        item.append(
          panel('i', 'history-dot ' + (status.ok ? 'ok' : 'bad')),
          panel('strong', '', record.operation),
          panel('small', '', record.duration + ' ms')
        );
        item.addEventListener('click', () => renderResponse(record));
        list.appendChild(item);
      });
      wrap.appendChild(list);
      catalogBody.appendChild(wrap);
    }

    async function sendOperation() {
      if (state.busy) return;
      const token = getToken();
      if (!token) {
        showToast('请先填写个人 token', true);
        $('token').focus();
        return;
      }
      let payload;
      try { payload = buildPayload(); }
      catch (error) { showToast(error.message, true); return; }
      const operation = payload.operation;
      if (!operation) { showToast('请选择业务操作', true); return; }
      state.busy = true;
      $('sendBtn').disabled = true;
      $('sendLabel').textContent = '执行中…';
      $('resultBody').innerHTML = '<div class="empty-result"><div><span class="spinner"></span><br><br>正在等待业务返回…</div></div>';
      const started = performance.now();
      try {
        const response = await fetchJSON('/api/operation', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        }, 600000);
        const record = {
          id: Date.now() + '-' + Math.random().toString(16).slice(2),
          operation,
          request: maskPayload(payload),
          payload: response.payload,
          http: response.http,
          duration: Math.round(performance.now() - started),
          at: new Date()
        };
        state.history.push(record);
        if (state.history.length > 20) state.history.shift();
        renderHistory();
        renderResponse(record);
        const status = statusOf(record.payload);
        showToast(status.ok ? '业务操作成功' : '业务操作返回失败', !status.ok);
      } catch (error) {
        const record = {
          id: Date.now() + '-error',
          operation,
          request: maskPayload(payload),
          payload: {ok: false, data: null, error: error.name === 'AbortError' ? '请求超时' : error.message},
          http: error.status || 0,
          duration: Math.round(performance.now() - started),
          at: new Date()
        };
        state.history.push(record);
        renderHistory();
        renderResponse(record);
        showToast(error.name === 'AbortError' ? '请求超时' : error.message, true);
      } finally {
        state.busy = false;
        $('sendBtn').disabled = false;
        $('sendLabel').textContent = '执行操作';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      sendOperation();
    });
    $('search').addEventListener('input', renderCatalog);
    $('checkBtn').addEventListener('click', checkConnection);
    $('token').addEventListener('input', updatePreview);
    $('baseUrl').addEventListener('input', updatePreview);
    $('revealToken').addEventListener('click', () => {
      $('token').type = $('token').type === 'password' ? 'text' : 'password';
    });
    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        if (!$('sendBtn').disabled) sendOperation();
      }
    });

    if (location.protocol === 'file:' && !$('baseUrl').value) {
      $('baseUrl').value = 'http://127.0.0.1:8130';
    }
    renderCatalog();
    renderForm();
    checkConnection();
  </script>
</body>
</html>
