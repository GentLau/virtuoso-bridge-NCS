# Evidence-grade coverage configuration.
#
# The project's default configuration honours "# pragma: no cover" markers.
# This config deliberately ignores them so that the evidence pack can show the
# reviewer that no executable line is hidden behind a pragma: pragma-marked
# lines that are genuinely unreachable then surface in the strict report and
# must be justified in test/reports/coverage-rules.json instead.
#
# Structural non-code stays excluded: ``...`` stubs (ABC/Protocol signatures)
# and ``if TYPE_CHECKING:`` blocks have no runtime behaviour to exercise.
#
# Usage (report-time only; the .coverage data file records executed arcs
# regardless of exclusions):
#
#   python -m coverage json --rcfile=test/shared/runners/coverage-strict.ini -o ...
#   python -m coverage report --rcfile=... -m

[run]
branch = True

[report]
exclude_lines =
    ^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)
    if (typing\.)?TYPE_CHECKING:
