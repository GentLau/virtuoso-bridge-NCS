[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuoso-bridge"
version = "0.9.0"
description = "Four-layer bridge for Cadence Virtuoso: HTTP server, business packages, transport runtime, SKILL daemon"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "paramiko>=3.5",
    "PySocks>=1.7.1",
    "eval-type-backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
# Complete test environment, including the optional SSH backend exercised by
# the transport suite.
dev = ["pytest>=7.0", "paramiko>=3.5", "PySocks>=1.7.1", "coverage>=7.0"]

[project.scripts]
virtuoso-bridge = "register.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"register" = ["registration_page.html"]
"bridge.resources" = ["*.il", "*.py"]

[tool.pytest.ini_options]
testpaths = ["test/offline/unit", "test/offline/integration", "test/offline/scenario"]
pythonpath = ["src"]
addopts = "-q"
